<!-- Botón flotante -->
<div class="fixed bottom-6 right-6 z-50 flex flex-col items-end gap-3">

  <!-- Panel del chat -->
  @if (abierto) {
  <div class="w-80 sm:w-96 bg-white rounded-2xl shadow-2xl border border-gray-100 flex flex-col overflow-hidden"
    style="height: 480px;">

    <!-- Header -->
    <div class="bg-indigo-300 px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-full bg-white relative overflow-visible">
          <svg class="w-16 h-16 absolute -top-4 -left-4" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#E8E6FF" />
                <stop offset="100%" stop-color="#9FA8F8" stop-opacity="0" />
              </radialGradient>
            </defs>
            <ellipse cx="340" cy="80" rx="14" ry="26" fill="#9FA8F8" opacity="0.88" transform="rotate(0, 340, 150)" />
            <ellipse cx="390" cy="99" rx="14" ry="26" fill="#B8BEF9" opacity="0.88" transform="rotate(45, 340, 150)" />
            <ellipse cx="410" cy="150" rx="14" ry="26" fill="#9FA8F8" opacity="0.88" transform="rotate(90, 340, 150)" />
            <ellipse cx="390" cy="201" rx="14" ry="26" fill="#BFC4FA" opacity="0.88"
              transform="rotate(135, 340, 150)" />
            <ellipse cx="340" cy="220" rx="14" ry="26" fill="#9FA8F8" opacity="0.88"
              transform="rotate(180, 340, 150)" />
            <ellipse cx="290" cy="201" rx="14" ry="26" fill="#B0B7F9" opacity="0.88"
              transform="rotate(225, 340, 150)" />
            <ellipse cx="270" cy="150" rx="14" ry="26" fill="#9FA8F8" opacity="0.88"
              transform="rotate(270, 340, 150)" />
            <ellipse cx="290" cy="99" rx="14" ry="26" fill="#C5C9FA" opacity="0.88" transform="rotate(315, 340, 150)" />
            <ellipse cx="340" cy="112" rx="8" ry="18" fill="#CFD3FB" opacity="0.75"
              transform="rotate(22.5, 340, 150)" />
            <ellipse cx="369" cy="121" rx="8" ry="18" fill="#CFD3FB" opacity="0.75"
              transform="rotate(67.5, 340, 150)" />
            <ellipse cx="378" cy="150" rx="8" ry="18" fill="#CFD3FB" opacity="0.75"
              transform="rotate(112.5, 340, 150)" />
            <ellipse cx="369" cy="179" rx="8" ry="18" fill="#CFD3FB" opacity="0.75"
              transform="rotate(157.5, 340, 150)" />
            <ellipse cx="340" cy="188" rx="8" ry="18" fill="#CFD3FB" opacity="0.75"
              transform="rotate(202.5, 340, 150)" />
            <ellipse cx="311" cy="179" rx="8" ry="18" fill="#CFD3FB" opacity="0.75"
              transform="rotate(247.5, 340, 150)" />
            <ellipse cx="302" cy="150" rx="8" ry="18" fill="#CFD3FB" opacity="0.75"
              transform="rotate(292.5, 340, 150)" />
            <ellipse cx="311" cy="121" rx="8" ry="18" fill="#CFD3FB" opacity="0.75"
              transform="rotate(337.5, 340, 150)" />
            <circle cx="340" cy="150" r="44" fill="url(#center-glow)" opacity="0.6" />
            <circle cx="340" cy="150" r="20" fill="white" opacity="0.95" />
            <circle cx="340" cy="150" r="17" fill="#9FA8F8" />
            <circle cx="333" cy="144" r="4" fill="#FFB3C6" />
            <circle cx="347" cy="144" r="4" fill="#A8E6CF" />
            <circle cx="340" cy="156" r="4" fill="#FFD6A5" />
          </svg>
        </div>
        <div>
          <p class="text-white text-sm font-bold leading-none">Asistente SpectBloom</p>
          <p class="text-indigo-100 text-xs mt-0.5">IA especializada en TEA y TDAH</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button (click)="limpiarChat()"
          class="text-white/70 hover:text-white transition-colors text-xs px-2 py-1 rounded-lg hover:bg-white/10"
          title="Limpiar chat">
          ↺
        </button>
        <button (click)="toggleChat()"
          class="text-white/70 hover:text-white transition-colors w-7 h-7 flex items-center justify-center rounded-lg hover:bg-white/10">
          ✕
        </button>
      </div>
    </div>

    <!-- Mensajes -->
    <div #messagesContainer class="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-50">
      @for (msg of mensajes; track $index) {
      <div class="flex" [class.justify-end]="msg.role === 'user'" [class.justify-start]="msg.role === 'assistant'">
        @if (msg.role === 'assistant') {
<div class="w-6 h-6 rounded-full bg-white overflow-hidden shrink-0">
  <svg class="w-10 h-10 -translate-x-2 -translate-y-2 scale-150" viewBox="0 0 680 300">
            <defs>
              <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#E8E6FF" />
                <stop offset="100%" stop-color="#9FA8F8" stop-opacity="0" />
              </radialGradient>
            </defs>
            <ellipse cx="340" cy="80" rx="14" ry="26" fill="#9FA8F8" opacity="0.88" transform="rotate(0, 340, 150)" />
            <ellipse cx="390" cy="99" rx="14" ry="26" fill="#B8BEF9" opacity="0.88" transform="rotate(45, 340, 150)" />
            <ellipse cx="410" cy="150" rx="14" ry="26" fill="#9FA8F8" opacity="0.88" transform="rotate(90, 340, 150)" />
            <ellipse cx="390" cy="201" rx="14" ry="26" fill="#BFC4FA" opacity="0.88"
              transform="rotate(135, 340, 150)" />
            <ellipse cx="340" cy="220" rx="14" ry="26" fill="#9FA8F8" opacity="0.88"
              transform="rotate(180, 340, 150)" />
            <ellipse cx="290" cy="201" rx="14" ry="26" fill="#B0B7F9" opacity="0.88"
              transform="rotate(225, 340, 150)" />
            <ellipse cx="270" cy="150" rx="14" ry="26" fill="#9FA8F8" opacity="0.88"
              transform="rotate(270, 340, 150)" />
            <ellipse cx="290" cy="99" rx="14" ry="26" fill="#C5C9FA" opacity="0.88" transform="rotate(315, 340, 150)" />
            <ellipse cx="340" cy="112" rx="8" ry="18" fill="#CFD3FB" opacity="0.75"
              transform="rotate(22.5, 340, 150)" />
            <ellipse cx="369" cy="121" rx="8" ry="18" fill="#CFD3FB" opacity="0.75"
              transform="rotate(67.5, 340, 150)" />
            <ellipse cx="378" cy="150" rx="8" ry="18" fill="#CFD3FB" opacity="0.75"
              transform="rotate(112.5, 340, 150)" />
            <ellipse cx="369" cy="179" rx="8" ry="18" fill="#CFD3FB" opacity="0.75"
              transform="rotate(157.5, 340, 150)" />
            <ellipse cx="340" cy="188" rx="8" ry="18" fill="#CFD3FB" opacity="0.75"
              transform="rotate(202.5, 340, 150)" />
            <ellipse cx="311" cy="179" rx="8" ry="18" fill="#CFD3FB" opacity="0.75"
              transform="rotate(247.5, 340, 150)" />
            <ellipse cx="302" cy="150" rx="8" ry="18" fill="#CFD3FB" opacity="0.75"
              transform="rotate(292.5, 340, 150)" />
            <ellipse cx="311" cy="121" rx="8" ry="18" fill="#CFD3FB" opacity="0.75"
              transform="rotate(337.5, 340, 150)" />
            <circle cx="340" cy="150" r="44" fill="url(#center-glow)" opacity="0.6" />
            <circle cx="340" cy="150" r="20" fill="white" opacity="0.95" />
            <circle cx="340" cy="150" r="17" fill="#9FA8F8" />
            <circle cx="333" cy="144" r="4" fill="#FFB3C6" />
            <circle cx="347" cy="144" r="4" fill="#A8E6CF" />
            <circle cx="340" cy="156" r="4" fill="#FFD6A5" />
          </svg>
        </div>
        }
        <div class="max-w-[75%] px-3 py-2 rounded-2xl text-sm leading-relaxed"
          [class.bg-indigo-400]="msg.role === 'user'" [class.text-white]="msg.role === 'user'"
          [class.rounded-br-sm]="msg.role === 'user'" [class.bg-white]="msg.role === 'assistant'"
          [class.text-gray-700]="msg.role === 'assistant'" [class.border]="msg.role === 'assistant'"
          [class.border-gray-100]="msg.role === 'assistant'" [class.rounded-bl-sm]="msg.role === 'assistant'"
          [class.shadow-sm]="msg.role === 'assistant'">
          {{ msg.content }}
        </div>
      </div>
      }

      <!-- Indicator de escribiendo -->
      @if (cargando) {
      <div class="flex justify-start">
        <div
          class="bg-white border border-gray-100 shadow-sm px-4 py-3 rounded-2xl rounded-bl-sm flex items-center gap-1">
          <span class="w-1.5 h-1.5 bg-indigo-300 rounded-full animate-bounce" style="animation-delay: 0ms"></span>
          <span class="w-1.5 h-1.5 bg-indigo-300 rounded-full animate-bounce" style="animation-delay: 150ms"></span>
          <span class="w-1.5 h-1.5 bg-indigo-300 rounded-full animate-bounce" style="animation-delay: 300ms"></span>
        </div>
      </div>
      }
    </div>

    <!-- Input -->
    <div class="p-3 border-t border-gray-100 bg-white">
      <div class="flex items-end gap-2">
        <textarea [(ngModel)]="inputMensaje" (keydown)="onKeydown($event)" [disabled]="cargando"
          placeholder="Escribe tu pregunta..." rows="1"
          class="flex-1 resize-none border border-gray-200 rounded-xl px-3 py-2 text-sm text-gray-700 focus:outline-none focus:border-indigo-300 transition-colors disabled:opacity-50 max-h-24"></textarea>
        <button (click)="enviar()" [disabled]="!inputMensaje.trim() || cargando"
          class="w-9 h-9 bg-indigo-400 hover:bg-indigo-500 disabled:opacity-40 text-white rounded-xl flex items-center justify-center transition-colors shrink-0">
          <svg class="w-4 h-4 rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 19V5m0 0l-7 7m7-7l7 7" />
          </svg>
        </button>
      </div>
    </div>

  </div>
  }

</div>
