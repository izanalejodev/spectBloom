<!-- CONTENIDO -->
<main class="flex-1 flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-300">

    <!-- CARD -->
    <div class="bg-white rounded-2xl border border-gray-100 p-8">

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()"
        class="flex flex-col gap-5 border-2 border-gray-300 p-8 rounded-lg">

        <!-- Título -->
        <div class="text-center mb-2">
          <h2 class="text-xl font-bold text-gray-700">Bienvenido de nuevo!</h2>
          <p class="text-xs text-indigo-400 mt-1">Inicia sesión en tu cuenta</p>
        </div>

        <!-- Mensaje de error general -->
        <div *ngIf="error" class="error-message" class="text-red-600 text-xs">
          {{ error }}
        </div>

        <!-- Email -->
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-bold text-gray-400 uppercase tracking-wide">
            Correo electrónico <span class="text-indigo-400">*</span>
          </label>
          <input type="email" formControlName="email" placeholder="correo@ejemplo.com"
            class="w-full px-4 py-2.5 rounded-xl border border-gray-200 bg-[#FFF9F4] text-sm text-gray-700 placeholder-gray-300 outline-none focus:border-indigo-400 focus:bg-white transition-colors"
            [class.border-red-300]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" />
        </div>
        <!-- Mensajes de error específicos para email -->
        <div *ngIf="errorEmail" class="text-red-600 text-xs">
          {{ errorEmail }}
        </div>
        <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="error-text">
          <div *ngIf="loginForm.get('email')?.errors?.['required']" class="text-red-600 text-xs">
            El correo electrónico es obligatorio
          </div>
          <div *ngIf="loginForm.get('email')?.errors?.['email']" class="text-red-600 text-xs">
            Ingresa un correo electrónico válido
          </div>
        </div>

        <!-- Contraseña -->
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-bold text-gray-400 uppercase tracking-wide">
            Contraseña <span class="text-indigo-400">*</span>
          </label>
          <input type="password" formControlName="password" placeholder="Introduce tu contraseña"
            class="w-full px-4 py-2.5 rounded-xl border border-gray-200 bg-[#FFF9F4] text-sm text-gray-700 placeholder-gray-300 outline-none focus:border-indigo-400 focus:bg-white transition-colors"
            [class.border-red-300]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" />
        </div>
        <!-- Mensaje de error para contraseña -->
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error-text">
          <div *ngIf="loginForm.get('password')?.errors?.['required']" class="text-red-600 text-xs">
            La contraseña es obligatoria
          </div>
        </div>

        <!-- Botón -->
        <button type="submit" [disabled]="loading"
          class="w-full bg-indigo-400 hover:bg-indigo-500 text-white font-bold py-3 rounded-full transition-colors text-sm mt-1 disabled:opacity-50 disabled:cursor-not-allowed">
          {{ loading ? 'Iniciando sesión...' : 'Iniciar sesión' }}
        </button>

        <!-- Separador -->
        <div class="flex items-center gap-3">
          <div class="flex-1 h-px bg-gray-100"></div>
          <span class="text-xs text-gray-300 font-semibold">o</span>
          <div class="flex-1 h-px bg-gray-100"></div>
        </div>

        <!-- Registro -->
        <p class="text-center text-xs text-gray-400">
          ¿No tienes cuenta?
          <a routerLink="/registro" class="text-indigo-400 font-bold hover:underline">
            Crear cuenta
          </a>
        </p>
            <div id="googleBtn" class="w-full flex justify-center"></div>


      </form>
    </div>

  </div>
</main>
